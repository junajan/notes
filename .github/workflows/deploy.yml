name: Deploy to Remote Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder' # Will be updated by ssh-keyscan

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'backend/data' \
            --exclude 'frontend/dist' \
            ./ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_PATH }}

      - name: Build and Run on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.REMOTE_PATH }}
            
            # Install dependencies for the whole project
            npm install
            
            # Build Shared package
            npm run build --workspace=@notes/shared
            
            # Build Backend
            npm run build --workspace=@notes/backend
            
            # Build Frontend
            npm run build --workspace=@notes/frontend
            
            # Ensure forever is available (using npx)
            # Stop existing process if it exists (ignoring error if it doesn't)
            npx forever stop ${{ secrets.REMOTE_PATH }}/backend/dist/backend/src/server.js || true
            
            # Start backend with forever
            # Injecting production env vars
            APP_PASSWORD="${{ secrets.APP_PASSWORD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            NODE_ENV="production" \
            PORT=3000 \
            npx forever start -a -l forever.log -o out.log -e err.log ${{ secrets.REMOTE_PATH }}/backend/dist/backend/src/server.js
