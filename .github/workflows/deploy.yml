name: CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Shared
        run: npm run build --workspace=@notes/shared

      - name: Run Backend Tests
        run: |
          cd backend
          JWT_SECRET=ci-test-secret NODE_ENV=test npm test

  deploy:
    name: Deploy to Remote Server
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "placeholder" # Will be updated by ssh-keyscan in the next step

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'backend/data' \
            --exclude 'frontend/dist' \
            ./ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_PATH }}

      - name: Build and Run on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Load environment
            [ -f ~/.zshrc ] && source ~/.zshrc
            [ -f ~/.bashrc ] && source ~/.bashrc
            
            cd ${{ secrets.REMOTE_PATH }}
            
            npm install
            npm run build --workspace=@notes/shared
            npm run build --workspace=@notes/backend
            npm run build --workspace=@notes/frontend
            
            npx forever stop ${{ secrets.REMOTE_PATH }}/backend/dist/backend/src/server.js || true
            
            APP_PASSWORD="${{ secrets.APP_PASSWORD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            NODE_ENV="production" \
            PORT=3000 \
            npx forever start -a -l forever.log -o out.log -e err.log ${{ secrets.REMOTE_PATH }}/backend/dist/backend/src/server.js
